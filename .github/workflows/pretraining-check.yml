name: Studio Avant formation checks

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pretraining-check.yml'
      - 'src/lib/server/dailyAgentTasks.ts'
      - 'src/app/agent/**/daily/pretraining-documents/**'
      - 'src/app/agent/daily/pretraining-documents/**'
      - 'supabase/migrations/*pretraining*.sql'
      - 'tests/daily*Pretraining*.test.mjs'
      - 'tests/dailyActiveTaskBehavior.test.mjs'
      - 'tests/dailySessionTaskAggregation.test.mjs'
      - 'tests/dailySessionTimeline.test.mjs'
      - 'tests/dailySessionClosureScope.test.mjs'
      - 'tests/dailySessionSatisfactionScope.test.mjs'
      - 'src/app/agent/daily/session-dossiers/**/satisfaction/**'
      - 'src/app/agent/daily/session-dossiers/**/timeline/**'
      - 'src/app/agent/daily/session-dossiers/**/closure/**'
      - 'package*.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pretraining-check.yml'
      - 'src/lib/server/dailyAgentTasks.ts'
      - 'src/app/agent/**/daily/pretraining-documents/**'
      - 'src/app/agent/daily/pretraining-documents/**'
      - 'supabase/migrations/*pretraining*.sql'
      - 'tests/daily*Pretraining*.test.mjs'
      - 'tests/dailyActiveTaskBehavior.test.mjs'
      - 'tests/dailySessionTaskAggregation.test.mjs'
      - 'tests/dailySessionTimeline.test.mjs'
      - 'tests/dailySessionClosureScope.test.mjs'
      - 'tests/dailySessionSatisfactionScope.test.mjs'
      - 'src/app/agent/daily/session-dossiers/**/satisfaction/**'
      - 'src/app/agent/daily/session-dossiers/**/timeline/**'
      - 'src/app/agent/daily/session-dossiers/**/closure/**'
      - 'package*.json'

permissions:
  contents: read

concurrency:
  group: studio-pretraining-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://build-only.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - name: ESLint ciblé timeline et clôture sécurisées
        run: npx eslint 'src/app/agent/daily/session-dossiers/[id]/timeline/page.tsx' 'src/app/agent/daily/session-dossiers/[id]/closure/page.tsx' 'tests/dailySessionTaskAggregation.test.mjs' 'tests/dailySessionClosureScope.test.mjs'
      - name: ESLint ciblé satisfaction et analyse post-formation
        run: npx eslint 'src/app/agent/daily/session-dossiers/[id]/satisfaction/page.tsx' 'tests/dailySessionSatisfactionScope.test.mjs'
      - name: Tests, typecheck and build without production credentials
        run: |
          npm test
          npm run typecheck
          npm run build
