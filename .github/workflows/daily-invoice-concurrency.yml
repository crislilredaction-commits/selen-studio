name: Daily invoice concurrency
on:
  pull_request:
    paths:
      - "scripts/recipe-daily-invoices.mjs"
      - "src/lib/server/*Invoice*.ts"
      - "supabase/migrations/*daily*invoice*.sql"
      - ".github/workflows/daily-invoice-concurrency.yml"
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Start an ephemeral PostgreSQL instance and run concurrent invoice deliveries
        run: |
          npm install --prefix "$RUNNER_TEMP/invoice-db" --no-audit --no-fund embedded-postgres@18.6.0-beta.19 pg@8.16.3
          node scripts/recipe-daily-invoices.mjs --studio-only "$RUNNER_TEMP/invoice-db"
